name: Version and Release
env:
  VITE_STREAM_API_KEY: ${{ vars.CLIENT_TEST_API_KEY }}
  VITE_STREAM_API_SECRET: ${{ secrets.CLIENT_TEST_SECRET }}
  VITE_API_URL: ${{ vars.CLIENT_TEST_API_URL }}

on:
  # Releases are cut by hand (Actions -> Version and Release -> Run workflow) on main.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: compute the release versions, publish nothing'
        type: boolean
        default: true

concurrency:
  group: version-and-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write # npm trusted publishing (OIDC)
  contents: write # version commits, tags and GitHub releases

jobs:
  version-and-release:
    if: github.ref == 'refs/heads/main'
    # Every run waits for a reviewer's approval, only main may use this environment,
    # and the npm trusted publisher requires it.
    environment: npm-release
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Lint Packages
        run: yarn lint:all

      - name: Build packages
        run: NODE_ENV=production yarn build:libs

      - name: Test packages
        run: yarn test:ci:libs

      - name: Run docs code snippets
        run: yarn test:docs-snippets

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub releases
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"
          yarn config set npmRegistryServer https://registry.npmjs.org/
          yarn release ${{ inputs.dry_run && '--dryRun' || '' }}
