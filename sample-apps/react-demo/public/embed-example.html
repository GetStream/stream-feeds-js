<!doctype html>
<meta charset="utf-8" />
<title>Embed example</title>
<style>
  body {
    margin: 0;
    font:
      14px system-ui,
      sans-serif;
  }
  .frame {
    position: relative;
    height: 100dvh;
    background: #f5f5f5;
  }
  .frame iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    opacity: 0;
    transition: opacity 400ms ease;
  }
  .frame[data-ready='true'] iframe {
    opacity: 1;
  }
  .loader {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: #737373;
    transition: opacity 400ms ease;
  }
  .frame[data-ready='true'] .loader {
    opacity: 0;
    pointer-events: none;
  }
</style>

<div class="frame" id="frame">
  <iframe id="demo" title="Stream feeds demo"></iframe>
  <div class="loader">Loading demo…</div>
</div>

<script>
  const frame = document.getElementById('frame');
  const iframe = document.getElementById('demo');

  // Resume the user of an earlier page view in this tab, if there was one
  const sessionKey = 'stream-feeds-demo-session';
  const session = sessionStorage.getItem(sessionKey);
  iframe.src = '/home' + (session ? `?session=${session}` : '');

  window.addEventListener('message', (event) => {
    if (event.source !== iframe.contentWindow) return;
    if (event.data?.source !== 'stream-feeds-demo') return;

    if (event.data.type === 'session') {
      sessionStorage.setItem(sessionKey, event.data.session);
    }
    if (event.data.type === 'ready') {
      frame.dataset.ready = 'true';
    }
  });

  // Covers a listener attached after the demo had already announced itself
  iframe.addEventListener('load', () => {
    iframe.contentWindow.postMessage(
      { source: 'stream-feeds-demo', type: 'ready?' },
      '*',
    );
  });
</script>
